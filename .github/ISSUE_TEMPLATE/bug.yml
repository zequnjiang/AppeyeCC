name: 缺陷（Bug）
description: 测试或使用中发现的问题
labels: ["type:bug", "status:backlog"]
body:
  - type: textarea
    id: repro
    attributes: { label: 复现步骤 }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 预期结果 }
  - type: textarea
    id: actual
    attributes: { label: 实际结果（含日志/截图） }
  - type: input
    id: related
    attributes: { label: 关联需求, placeholder: "#12" }
